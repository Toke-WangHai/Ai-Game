<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修仙重生模拟器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
        html,body{width:100%;height:100%;overflow:hidden}
        body{background:#1a1a2e;color:#fff;padding:20px;display:flex;align-items:flex-start;justify-content:center}
        .game-container{width:1000px;background:rgba(0,0,0,0.7);padding:30px;border-radius:16px}
        .title{text-align:center;font-size:36px;color:#ffd700;margin-bottom:20px}
        .panel{margin:20px 0;padding:20px;border:2px solid #3498db;border-radius:10px}
        .attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
        .attr-item{background:rgba(255,255,255,0.1);padding:10px;text-align:center;border-radius:8px}
        .word-list{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}
        .word-item{padding:8px 16px;background:#9b59b6;border-radius:20px;cursor:pointer}
        .word-item.selected{background:#e74c3c}
        .event-log{height:220px;background:rgba(0,0,0,0.5);padding:15px;overflow-y:auto}
        .btn{padding:12px 30px;margin:5px;border:none;border-radius:8px;color:#fff;cursor:pointer}
        .btn-primary{background:#3498db}
        .btn-success{background:#2ecc71}
        .btn-danger{background:#e74c3c}
        .status{text-align:center;font-size:26px;margin:20px 0}
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">修仙重生模拟器</h1>
        <div id="status" class="status">加载配置中...</div>

        <div class="panel">
            <div>角色属性</div>
            <div class="attrs">
                <div class="attr-item">修为 <div id="xiuyi">0</div></div>
                <div class="attr-item">体魄 <div id="tipao">0</div></div>
                <div class="attr-item">寿命 <div id="shouming">0</div></div>
                <div class="attr-item">气运 <div id="qiyun">0</div></div>
                <div class="attr-item">元神 <div id="yuanshen">0</div></div>
                <div class="attr-item">年龄 <div id="age">0</div></div>
            </div>
        </div>

        <div id="wordPanel" class="panel" style="display:none">
            <div>选择3个出生词条</div>
            <div id="wordList" class="word-list"></div>
            <button id="confirm" class="btn btn-primary">确认词条</button>
        </div>

        <div class="panel">人生经历<div id="log" class="event-log"></div></div>

        <div style="text-align:center">
            <button id="next" class="btn btn-success" disabled>下一岁</button>
            <button id="rebirth" class="btn btn-danger" style="display:none">重新重生</button>
        </div>
    </div>

    <!-- 引入模块 -->
    <script src="src/utils.js"></script>
    <script src="src/data.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/game.js"></script>

    <!-- 游戏主入口 -->
    <script>
        // 启动游戏
        function startGame() {
            try {
                const data = loadAllData()
                initData(data.baseAttr, data.words, data.events)
                init()
                updateStatus('请选择3个天赋词条', '#fff')
                showWordPanel()
            } catch (e) {
                updateStatus('配置加载失败：' + e.message, '#e74c3c')
                console.error('配置加载错误:', e)
            }
        }

        // 绑定事件
        $('confirm').onclick = confirmWords
        $('next').onclick = nextAge
        $('rebirth').onclick = rebirth

        // 启动游戏
        startGame()

        // 窗口缩放适配
        function handleResize() {
            const windowWidth = window.innerWidth
            const windowHeight = window.innerHeight

            // 基准尺寸（设计稿尺寸）
            const baseWidth = 1000
            const baseHeight = 1200

            // 计算缩放比例（取较小值以适应屏幕）
            const scaleX = windowWidth / baseWidth
            const scaleY = windowHeight / baseHeight
            const scale = Math.min(scaleX, scaleY)

            // 应用缩放
            const container = document.querySelector('.game-container')
            container.style.transform = `scale(${scale})`
            container.style.transformOrigin = 'top center'
        }

        // 监听窗口大小变化
        window.addEventListener('resize', handleResize)
        window.addEventListener('load', handleResize)
    </script>
</body>
</html>
